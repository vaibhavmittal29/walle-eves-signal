name: WALL-E CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run fast test suite (separation, unit, config, invariants, viz, calibration)
        run: |
          pytest -k "not test_fuzz and not test_safety_property_100_seeds" -v

      - name: Run AST security check (zero eval/exec policy)
        run: |
          pytest tests/test_separation.py -v

      - name: Replay verify sample missions
        run: |
          python -m walle verify outputs/mission_easy
          python -m walle verify outputs/mission_medium_seed7
          python -m walle verify outputs/mission_hard_decoys
