mission:
  name: mission_hard_decoys
  seed: 99
  grid:
    width: 20
    height: 20
  start: [2, 2]
  obstacles:
    mode: random
    density: 0.12
  chargers: [[2, 2], [15, 9], [6, 17]]
  eve:
    location: random
    status: random
    mobility: static
    min_distance_from_start: 9
  clues:
    count: 6
    placement: random
    type_mix: {bearing: 0.5, range: 0.3, status: 0.2}

initial_signal:
  bearing_deg: 120.0
  coordinates: null
  coordinates_sigma: 5.0
  strength: 0.25
  timestamp: 0

resources:
  battery_capacity: 100
  battery_initial: 100
  time_budget: 300
  costs:
    move:        {battery: 1, time: 1}
    scan_signal: {battery: 2, time: 1}
    scan_area:   {battery_base: 2, battery_per_radius: 2, time_base: 1, time_per_radius: 1, max_radius: 3}
    recharge:    {battery_gain: 20, time: 2}

sensor:
  noise_scale: 1.5
  strength_sigma: 0.06
  bearing_sigma_base_deg: 10.0
  bearing_sigma_per_cell_deg: 2.5
  d0: 6.0
  amplitude: {active: 1.0, low_power: 0.6, damaged: 0.35}
  dropout:   {active: 0.08, low_power: 0.30, damaged: 0.55}
  decoys:
    count: 2
    spoof_probability: 0.15
  clue_noise:
    bearing_sigma_deg: 18.0
    range_sigma: 2.5
    status_accuracy: 0.75
    detect_probability: 0.85
    false_clue_probability: 0.10

agent:
  type: bayes_planner
  seed: 456
  assumed_spoof_rate: 0.15
  mc_samples: 50
  max_candidates: 30
  thresholds:
    track: 0.50
    verify: 0.75
    declare_location: 0.90
    declare_status: 0.70
  safety:
    margin_fraction: 0.10
    margin_flat: 3
