mission:
  name: mission_easy
  seed: 42
  grid:
    width: 12
    height: 12
  start: [1, 1]
  obstacles:
    mode: random
    density: 0.08
  chargers: [[1, 1]]
  eve:
    location: random
    status: active
    mobility: static
    min_distance_from_start: 5
  clues:
    count: 3
    placement: random
    type_mix: {bearing: 0.5, range: 0.3, status: 0.2}

initial_signal:
  bearing_deg: 153.0
  coordinates: null
  coordinates_sigma: 3.0
  strength: 0.17
  timestamp: 0

resources:
  battery_capacity: 100
  battery_initial: 100
  time_budget: 200
  costs:
    move:        {battery: 1, time: 1}
    scan_signal: {battery: 2, time: 1}
    scan_area:   {battery_base: 2, battery_per_radius: 2, time_base: 1, time_per_radius: 1, max_radius: 3}
    recharge:    {battery_gain: 25, time: 2}

sensor:
  noise_scale: 1.0
  strength_sigma: 0.04
  bearing_sigma_base_deg: 6.0
  bearing_sigma_per_cell_deg: 1.5
  d0: 5.0
  amplitude: {active: 1.0, low_power: 0.6, damaged: 0.35}
  dropout:   {active: 0.02, low_power: 0.15, damaged: 0.35}
  decoys:
    count: 0
    spoof_probability: 0.0
  clue_noise:
    bearing_sigma_deg: 10.0
    range_sigma: 1.5
    status_accuracy: 0.9
    detect_probability: 0.95
    false_clue_probability: 0.0

agent:
  type: bayes_planner
  seed: 101
  assumed_spoof_rate: 0.0
  mc_samples: 40
  max_candidates: 25
  thresholds:
    track: 0.45
    verify: 0.70
    declare_location: 0.85
    declare_status: 0.65
  safety:
    margin_fraction: 0.10
    margin_flat: 3
